<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="calculator">
    <header class="calculator__header">
      <span class="calculator__title">계산기</span>
      <button class="mode-toggle" id="mode-toggle" type="button">공학용</button>
    </header>
    <section class="display">
      <div class="display__expression" id="expression"></div>
      <div class="display__value" id="value">0</div>
    </section>

    <section class="keys keys--scientific" id="scientific-keys" hidden>
      <button class="key key--func" data-action="angle">DEG</button>
      <button class="key key--func" data-constant="pi">π</button>
      <button class="key key--func" data-constant="e">e</button>
      <button class="key key--func" data-function="sqrt">√</button>
      <button class="key key--func" data-function="square">x²</button>
      <button class="key key--op" data-operator="^">xʸ</button>
      <button class="key key--func" data-function="reciprocal">1/x</button>
      <button class="key key--func" data-function="factorial">n!</button>
      <button class="key key--func" data-function="sin">sin</button>
      <button class="key key--func" data-function="cos">cos</button>
      <button class="key key--func" data-function="tan">tan</button>
      <button class="key key--func" data-function="log">log</button>
      <button class="key key--func" data-function="ln">ln</button>
      <button class="key key--func" data-function="asin">sin⁻¹</button>
      <button class="key key--func" data-function="acos">cos⁻¹</button>
      <button class="key key--func" data-function="atan">tan⁻¹</button>
    </section>

    <section class="keys keys--basic">
      <button class="key key--func" data-action="clear">AC</button>
      <button class="key key--func" data-action="sign">±</button>
      <button class="key key--func" data-action="percent">%</button>
      <button class="key key--op" data-operator="/">÷</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key key--op" data-operator="*">×</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key key--op" data-operator="-">−</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key key--op" data-operator="+">+</button>

      <button class="key" data-action="backspace">⌫</button>
      <button class="key" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key--equals" data-action="equals">=</button>
    </section>
  </main>

  <script src="js/calculator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
